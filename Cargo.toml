[package]
name = "vitaly"
version = "0.1.32"
edition = "2024"
description = "VIA/Vial API client and cli tool for guiless keyboard configuration."
license = "MIT"
homepage = "https://github.com/bskaplou/vitaly"
documentation = "https://github.com/bskaplou/vitaly"
repository = "https://github.com/bskaplou/vitaly"
readme = "README.md"
keywords = ["qmk", "via", "vial", "cli"]
categories = ["command-line-utilities", "command-line-interface"]

[dependencies]
anyhow = "1.0.100"
argh = "0.1.13"
atty = "0.2.14"
crossterm = "0.29.0"
hidapi = "2.6.3"
lzma-rust2 = "0.15.4"
palette = "0.7.6"
ratatui = "0.30.0"
serde_json = "1.0.145"
thiserror = "2.0.17"
ureq = "3.1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
